plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'  // 🔥 FIREBASE PLUGIN
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.castagallos.app"
    compileSdk = 36
    ndkVersion flutter.ndkVersion

    // 🔥 CRITICAL: Android 15 - Force 16KB Page Alignment
    bundle {
        abi {
            enableSplit = false  // Disable ABI splits to force universal APK with 16KB alignment
        }
        language {
            enableSplit = false
        }
        density {
            enableSplit = false  // Disable all splits to ensure 16KB alignment
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.castagallos.app"  // 🔥 CORREGIDO PARA COINCIDIR CON FIREBASE Y PLAY CONSOLE
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // 🔥 HABILITAR MULTIDEX PARA FLUTTER
        multiDexEnabled true

        // 🔥 ANDROID 15 COMPATIBILITY - Native Library Alignment 16KB
        ndk {
            debugSymbolLevel 'SYMBOL_TABLE'
            // Force 16KB page alignment for all architectures
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release

            // 🔒 DESHABILITADO TEMPORALMENTE PARA COMPILAR
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 🔥 ANDROID 15 - 16KB Page Alignment for Native Libraries
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
            // Force 16KB alignment for native libraries
            pickFirsts += ['**/libc++_shared.so', '**/libflutter.so']
        }
        // Ensure proper alignment for all native assets
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }


    // 🔥 ANDROID 15 - Additional NDK Configuration for 16KB Alignment
    splits {
        abi {
            enable false  // Disable ABI splits to force 16KB aligned universal APK
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // 🔥 MULTIDEX SUPPORT PARA FLUTTER
    implementation 'androidx.multidex:multidex:2.0.1'

    // 🔥 ANDROID 15 - Edge-to-Edge Display Support
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
}
