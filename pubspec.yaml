name: gallos_app_new
description: "Casta de Gallos - Aplicación profesional para criadores de gallos de pelea"
publish_to: 'none'
version: 1.6.1+904

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # 🚀 TODAS LAS DEPENDENCIAS - CONDITIONAL IMPORTS SE ENCARGA DE LA COMPATIBILIDAD
  provider: ^6.1.1
  go_router: ^14.2.3
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # UI y multimedia - LATEST VERSIONS with Privacy Manifests
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.1
  webview_flutter: ^4.7.0
  
  # Almacenamiento local - LATEST with Privacy Manifests
  shared_preferences: ^2.3.2
  sqflite: ^2.4.2
  
  # Utilidades
  intl: ^0.18.1
  uuid: ^4.2.1
  cupertino_icons: ^1.0.2
  crypto: ^3.0.3
  fl_chart: ^0.66.2
  
  # 📄 PDF y descargas - CON CONDITIONAL IMPORTS  
  universal_html: ^2.2.4
  path_provider: ^2.1.1
  url_launcher: ^6.2.5  # Stable with privacy manifest
  flutter_plugin_android_lifecycle: ^2.0.17
  permission_handler: ^11.3.0  # Latest stable
  printing: ^5.12.0  # Stable version
  pdf: ^3.10.8  # Compatible version
# share_plus: ^6.3.4  # Reemplazado por custom ShareService
  
  # 🔔 Firebase - WORKING VERSIONS (allowing Flutter to resolve)
  firebase_core: ^3.8.0  
  firebase_messaging: ^15.1.8
  flutter_local_notifications: ^18.0.1
  
  # 📱 Device info - REMOVIDO para evitar conflictos iOS
  # device_info_plus: ^9.1.2  # Reemplazado por custom DeviceService

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  intl: 0.18.1
  fl_chart: 0.66.2
  # Fix version conflicts
  collection: 1.18.0
  typed_data: 1.3.2
  http_parser: 4.0.2  # Versión estable compatible
  # Remove exact forcing to allow Flutter resolution

flutter:
  uses-material-design: true
  
  assets:
    - lib/data/mock/
    - assets/images/
    - assets/images/gallos/
    - assets/images/logo/
    - assets/images/icono/
    - assets/images/yape/
    - assets/images/modulos/
    - assets/images/home/